<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      font-family: Arial, sans-serif;
      padding: 12px;
      background-color: #0f172a;
      color: #cbd5e1;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: bold;
      color: #ff9933;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
    }
    .step {
      font-size: 11px;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .step-num {
      background-color: #ff9933;
      color: #0f172a;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      margin-right: 6px;
    }
    .badge {
      display: inline-block;
      font-size: 9px;
      background-color: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⚖️</span>
    <span class="title">Adhikar Copilot Guide</span>
  </div>
  <div class="step">
    <span class="step-num">1</span> Open <span style="color:#ff9933">Adhikar Web</span> & select your grievance docket.
  </div>
  <div class="step">
    <span class="step-num">2</span> Open PGPORTAL or RTI Online in this browser window.
  </div>
  <div class="step">
    <span class="step-num">3</span> Look for orange highlights on the fields, and click the pre-fill button.
  </div>
  <div class="step">
    <span class="step-num">4</span> Fill out the CAPTCHA manually and submit!
  </div>
  <center>
    <div class="badge">v1.0 (Demo Mode Active)</div>
  </center>
</body>
</html>
